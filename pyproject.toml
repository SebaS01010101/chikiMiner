[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chikiMiner"
version = "0.1.0"
description = "Detect GitHub repositories that use GitHub Agentic Workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
]

[project.scripts]
miner = "chikiminer.cli:app"
chikiminer = "chikiminer.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
